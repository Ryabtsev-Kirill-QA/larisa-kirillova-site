{{ $image := resources.Get .src }}
{{ if $image }}
  {{ $small := $image.Resize "400x webp q75" }}
  {{ $medium := $image.Resize "800x webp q75" }}
  {{ $large := $image.Resize "1200x webp q75" }}

  <img
    src="{{ $medium.RelPermalink }}"
    srcset="
      {{ $small.RelPermalink }} 400w,
      {{ $medium.RelPermalink }} 800w,
      {{ $large.RelPermalink }} 1200w
    "
    sizes="(max-width: 600px) 400px, (max-width: 1000px) 800px, 1200px"
    width="{{ $medium.Width }}"
    height="{{ $medium.Height }}"
    alt="{{ .alt }}"
    loading="{{ .loading | default "lazy" }}"
  >
{{ else }}
  <div style="background:#eee;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;">Image not found</div>
{{ end }}
